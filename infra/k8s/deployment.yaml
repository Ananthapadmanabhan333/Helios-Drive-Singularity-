apiVersion: apps/v1
kind: Deployment
metadata:
  name: helios-backend
  labels:
    app: helios-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: helios-backend
  template:
    metadata:
      labels:
        app: helios-backend
    spec:
      containers:
      - name: backend
        image: helios-drive/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_HOST
          value: "redis-service"
        - name: POSTGRES_HOST
          value: "postgres-service"
---
apiVersion: v1
kind: Service
metadata:
  name: helios-backend-service
spec:
  selector:
    app: helios-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helios-perception-gpu
  labels:
    app: helios-perception
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helios-perception
  template:
    metadata:
      labels:
        app: helios-perception
    spec:
      containers:
      - name: perception-engine
        image: helios-drive/perception:latest
        resources:
          limits:
            nvidia.com/gpu: 1
